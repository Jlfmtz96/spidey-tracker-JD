<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Banner OG</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; }
    .og-banner {
      width: 1200px;
      height: 630px;
      background-color: #041022;
      background-image: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 120%), url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
      border: 24px solid #3b8eb8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'VT323', monospace;
      color: #9eb4c6;
      box-sizing: border-box;
      position: relative;
    }
    .top-secret { color: #ff3b3b; font-size: 70px; letter-spacing: 6px; margin: 0; text-shadow: 4px 4px 0px #3a0a0c; }
    .name { color: #5ec8e8; font-size: 110px; margin: 10px 0 40px 0; text-shadow: 6px 6px 0px #061727; letter-spacing: 4px; }
    .action { background: #143a57; color: #fff; font-size: 45px; padding: 15px 40px; border: 4px solid #5ec8e8; box-shadow: 8px 8px 0px rgba(0,0,0,0.6); }
    .corner { position: absolute; width: 40px; height: 40px; border: 6px solid #5ec8e8; }
    .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
    .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }
  </style>
</head>
<body>
  <div class="og-banner">
    <div class="corner tl"></div>
    <p class="top-secret">MISIÓN CLASIFICADA: CUMPLEAÑOS</p>
    <h1 class="name">JOSÉ DAVID</h1>
    <div class="action">► ACCEDER AL RASTREADOR</div>
    <div class="corner br"></div>
  </div>
</body>
</html>
